[package]
name = "url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-auto-openapi = { version = "0.1.1", features = ["swagger-ui"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
schemars = { version = "1.2.3", features = ["uuid1", "chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
